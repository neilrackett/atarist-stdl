# Hatari configuration for two-joystick tests (tests/hatari/joychk.c):
# both IKBD ports emulated from the keyboard, so run.sh's keydown and
# keyup of these letters move them (a letter goes through Hatari's key
# handling, which gives a joystick's key to the joystick). Pass with
#   EXTRA="--configfile tests/hatari/joykeys.cfg ..."
# Port 0, the mouse port, is STDL's joystick 1 once a program asks for
# two; port 1 is joystick 0.
[Joystick0]
nJoystickMode = 2
bEnableAutoFire = FALSE
bEnableJumpOnFire2 = FALSE
kUp = W
kDown = X
kLeft = A
kRight = D
kFire = F

[Joystick1]
nJoystickMode = 2
bEnableAutoFire = FALSE
bEnableJumpOnFire2 = FALSE
kUp = I
kDown = K
kLeft = J
kRight = L
kFire = H
